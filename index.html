<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroller</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b1f27;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #app canvas {
      /* The renderer now supplies a native 1600x720 canvas. Keep it
         responsive without asking CSS to manufacture the extra pixels. */
      width: 1600px;
      height: 720px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
      object-fit: contain;
      image-rendering: pixelated;
      border: 2px solid #444;
      border-radius: 8px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
