<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streetwise: Nicole &amp; Stella</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b1f27;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #app canvas {
      /* The renderer now supplies a native 1600x720 canvas. Keep it
         responsive without asking CSS to manufacture the extra pixels. */
      width: 1600px;
      height: 720px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
      object-fit: contain;
      image-rendering: pixelated;
      border: 2px solid #444;
      border-radius: 8px;
      box-sizing: border-box;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10141c;
      color: #eef3f6;
      transition: opacity 240ms ease;
    }
    #loading-screen.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-card {
      width: min(340px, calc(100vw - 48px));
      text-align: center;
    }
    .loading-title {
      margin-bottom: 16px;
      color: #f2c14e;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .loading-track {
      height: 12px;
      overflow: hidden;
      border: 2px solid #05070c;
      border-radius: 2px;
      background: #252c38;
    }
    .loading-fill {
      width: 42%;
      height: 100%;
      background: repeating-linear-gradient(90deg, #e0752f 0 14px, #f2c14e 14px 28px);
      animation: loading-sweep 1.1s ease-in-out infinite alternate;
    }
    .loading-status {
      min-height: 18px;
      margin-top: 10px;
      color: #b7bcc4;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    #loading-retry {
      display: none;
      margin: 12px auto 0;
      padding: 8px 14px;
      border: 1px solid #f2c14e;
      border-radius: 3px;
      background: #202735;
      color: #f2c14e;
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }
    #loading-screen.has-error #loading-retry { display: block; }
    #loading-screen.has-error .loading-fill { animation-play-state: paused; }
    @keyframes loading-sweep {
      from { transform: translateX(-95%); }
      to { transform: translateX(235%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-fill { animation-duration: 2.5s; }
    }
  </style>
</head>
<body>
  <div id="loading-screen" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="loading-title">STREETWISE: NICOLE &amp; STELLA</div>
      <div class="loading-track" aria-hidden="true"><div class="loading-fill"></div></div>
      <div id="loading-status" class="loading-status">CONNECTING TO THE CITY…</div>
      <button id="loading-retry" type="button">RETRY</button>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
